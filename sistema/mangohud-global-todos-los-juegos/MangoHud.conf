# MangoHud — layout de una sola linea, orientado a diagnostico CPU-bound vs GPU-bound.
# Destino: ~/.config/MangoHud/MangoHud.conf
#
# Resultado aproximado:
#   GPU 68% 6.2GiB | CPU 91% 14.1GiB | 142 FPS 7.0ms | 1920x1080

legacy_layout=false
horizontal
hud_compact
hud_no_margin
position=top-left
font_size=18
background_alpha=0.4
round_corners=4
table_columns=20

fps
frametime
frame_timing=0

# gpu_load_change / cpu_load_change colorean el porcentaje al cruzar 60 y 90.
# GPU en verde con CPU en rojo = CPU-bound, sin leer los numeros.
gpu_stats
gpu_load_change
gpu_load_value=60,90
vram

cpu_stats
cpu_load_change
cpu_load_value=60,90
ram

# Resolucion del swapchain (la de salida). Con DLSS/FSR activos NO refleja
# la resolucion interna de render. Quitar esta linea si ocupa demasiado.
resolution

# El default de MangoHud para toggle_hud es Shift_R+F12, que colisiona con la
# tecla de captura de pantalla de Steam (F12). Por eso va en F10.
toggle_hud=Shift_R+F10
toggle_hud_position=Shift_R+F11
reload_cfg=Shift_L+F4
toggle_logging=Shift_L+F2

# Cambiar por una ruta propia si se van a guardar logs.
output_folder=/tmp/mangohud-logs
log_duration=60
